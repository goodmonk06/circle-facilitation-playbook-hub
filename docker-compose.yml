version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: playbook-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: playbook_user
      POSTGRES_PASSWORD: playbook_password
      POSTGRES_DB: playbook_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playbook_user -d playbook_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - playbook-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playbook-hub-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://playbook_user:playbook_password@postgres:5432/playbook_hub?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - playbook-network

volumes:
  postgres_data:

networks:
  playbook-network:
    driver: bridge
