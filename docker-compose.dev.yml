version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: playbook-hub-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: playbook_user
      POSTGRES_PASSWORD: playbook_password
      POSTGRES_DB: playbook_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playbook_user -d playbook_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
